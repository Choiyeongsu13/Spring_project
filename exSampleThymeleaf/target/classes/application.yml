spring:
  # secrets.yml(비밀번호 등 민감정보, git에 올라가지 않음)이 있으면 이 설정 위에 덮어씀
  config:
    import: optional:file:./secrets.yml

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521/xe
    username: c##sample
    password: 1234

  # google email 인증 (username/password는 secrets.yml에서 채움)
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8070

# mapper.xml 위치 : resource 폴더안에 mapper 폴더 생성
mybatis:
  mapper-locations: classpath:/mapper/**/*.xml

# 업로드 파일 저장 경로(실행 위치 기준 상대경로). 운영 배포시엔 절대경로로 바꿀 것.
app:
  upload-dir: ./uploads

