<!-- 메뉴 include -->
<th:block th:replace="~{Include/topmenu}"></th:block>

<html xmlns:th="http://www.thymeleaf.org">
   <head>
      <title> 자료실 내용 보기 </title>
 <link rel="stylesheet" type="text/css" href="/stylesheet.css">
   <style type="text/css">
     td.title { padding:4px; background-color:#e3e9ff }
     td.content { padding:10px; line-height:1.6em; text-align:justify; }
     a.list { text-decoration:none;color:black;font-size:10pt; }
   </style>
 </head>

   <!--DB에서 검색한 자료를 화면에 출력  -->
 <body topmargin="0" leftmargin="0">
 <table border="0" width="800">
   <tr>
     <td width="20%"  height="500" bgcolor="#ecf1ef" valign="top">

		<!--  로그인 폼 추가 -->
		<th:block th:replace="~{Include/login_form}"></th:block>

     </td>
     <td width="80%" valign="top">
       &nbsp;<br>
     <table border="0" width="90%" align="center">
       <tr>
         <td colspan="2"><img src="/Images/img/bullet-01.gif">
           <font color="blue" size="3">참 좋은 자료실</font><font size="2"> - 자료읽기</font></td>
       </tr>
     </table>
     <p>

     <table border="0" width="90%" align="center" cellspacing="0" style="border-width:1px;border-color:#0066cc;border-style:outset;">
       <tr bgcolor="e3e9ff">
         <td class="title">
           <img src="/Images/img/bullet-04.gif">
           <font size="2" face="돋움" th:text="${pds.subject}">좋은 하루 되세요
           </font></td></tr>
		<tr>
			<td class="content">
				<p align="right"><font size="2" face="돋움"> <span th:text="${pds.name}">홍길동</span> / <span th:text="${pds.regdate}">2007-10-11</span> / <span th:text="${pds.readcnt}">2</span>번 읽음
				<p><span th:utext="${pds.contents}">언제나 즐겁고 행복한 하루가 되었으면 합니다.</span><p>
				<th:block th:if="${displayFilename != null}">
				<a th:href="@{/Pds/pds_download(idx=${pds.idx})}"><img src="/Images/img/disk.gif" align="middle" width="22" height="20" border="0">&nbsp;<span th:text="${displayFilename}">test.zip</span></a>
				</th:block>

				</font>
			</td>
		</tr>
  </table>
  <p align="center">
  <font size="2">
  <a href="/Pds/pds_write"><img src="/Images/img/write.gif" border="0"></a>&nbsp;&nbsp;&nbsp;&nbsp;
  <a th:href="@{/Pds/pds_modify(idx=${pds.idx}, page=${page})}"><img src="/Images/img/edit-1.gif" border="0"></a>&nbsp;&nbsp;&nbsp;&nbsp;
  <a th:href="@{/Pds/pds_delete(idx=${pds.idx}, page=${page})}"><img src="/Images/img/del.gif" border="0"></a>&nbsp;&nbsp;&nbsp;&nbsp;
  <a th:href="@{/Pds/pds_list(page=${page})}"><img src="/Images/img/list-2.gif" border="0"></a></font></td></tr>
</table>
</body>
</html>
