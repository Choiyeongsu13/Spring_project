
<html xmlns:th="http://www.thymeleaf.org">
<head><title>게시글 삭제</title>
 <link rel="stylesheet" type="text/css" href="/stylesheet.css">
 </head>
 <body>
 <form method="post" th:action="@{/Board/board_delete}">
   <input type="hidden" name="idx" th:value="${idx}">
   <input type="hidden" name="page" th:value="${page}">
   <table border="0" cellpadding="0" cellspacing="0" width="300" align="center">
     <tr>
       <td height="50">
       <img src="/Images/img/bullet-05.gif"><b><font size="3" color="red">잠깐 !!</font></b></td></tr>
     <tr>
       <td valign="middle" height="30">
       <font size="2" face="돋움">게시물은 작성하신 분만 삭제할 수 있습니다.<br>
       글작성시 입력한 비밀번호를 입력해 주세요...</font></td></tr>
     <tr th:if="${error != null}">
       <td valign="middle" height="20"><font size="2" color="red" th:text="${error}">비밀번호가 일치하지 않습니다.</font></td></tr>
     <tr>
       <td valign="middle" height="40">
       <font size="2" face="돋움">
       비밀번호 <input type="password" name="pass" size="8"></font>
       <input type="submit" value="삭제">
       <input type="button" value="닫기" th:onclick="|location.href='@{/Board/board_view(idx=${idx}, page=${page})}'|"></td></tr>
   </table>
   </form>
 </body>
 </html>
