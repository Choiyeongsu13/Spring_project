
<!-- topmenu include -->
<th:block th:replace="~{Include/topmenu}"></th:block>

 <html xmlns:th="http://www.thymeleaf.org">
 <head><meta http-equiv="Content-Type" content="text/html; charset=utf-8">
   <title> 메인 페이지</title>
   <link rel="stylesheet" type="text/css" href="/stylesheet.css">
   <style type="text/css">
     td.title { padding:4px; background-color:#e3e9ff }
     td.content { padding:10px; line-height:1.6em; text-align:justify; }
     a.list { text-decoration:none;color:black;font-size:10pt; }
   </style>

 </head>
 <body topmargin="0" leftmargin="0">
   <table border="0" width="800">
     <tr>
       <td width="20%"  height="500" bgcolor="#ecf1ef" valign="top">

		 <!--  다음에 추가할 부분 -->
		<th:block th:replace="~{Include/login_form}"></th:block>

	   </td>
       <td width="80%" valign="top">&nbsp;<br>

      <table border="0" cellspacing="1" width="100%" align="center">
      <tr>
        <td colspan="7" align="center" valign="center" height="20">
        <font size="4" face="돋움" color="blue">
        <img src="/Images/img/bullet-01.gif"> <b>공 지 사 항</b></font></td></tr>
	   <tr bgcolor="e3e9ff">
 	      <td width="50%" align="center" height="20"><font face="돋움" size="2">제 목</font></td>
 	      <td width="15%" align="center" height="20"><font face="돋움" size="2">글쓴이</font></td>
 	      <td width="15%" align="center" height="20"><font face="돋움" size="2">작성일</font></td>
 	      <td width="10%" align="center" height="20"><font face="돋움" size="2">조회수</font></td>
 	   </tr>

	   <tr th:if="${#lists.isEmpty(noticeTopList)}">
	     <td colspan="4" align="center" height="20"><font face="돋움" size="2">등록된 공지사항이 없습니다.</font></td>
	   </tr>

	   <tr th:each="notice : ${noticeTopList}" onMouseOver="style.backgroundColor='#D1EEEE'" onMouseOut="style.backgroundColor=''">
			<td align="left" height="20">&nbsp;
				<font face="돋움" size="2" color="#000000">
				<a class="list" th:href="@{/Notice/notice_view(idx=${notice.idx})}" th:text="${notice.subject}">제목부분입니다</a></td>
					<td align="center" height="20"><font face="돋움" size="2">
					<span th:text="${notice.adid}">관리자</span></font></td>
				<td align="center" height="20"><font face="돋움" size="2" th:text="${notice.regdate}">2007-10-22</font></td>
				<td align="center" height="20"><font face="돋움" size="2"
				th:text="${notice.readcnt}">3</font></td>
			</tr>
  		</table>
  	<hr>
      <table border="0" cellspacing="1" width="100%" align="center">
      <tr>
        <td colspan="7" align="center" valign="center" height="20">
        <font size="4" face="돋움" color="blue">
        <img src="/Images/img/bullet-01.gif"> <b>게시판</b></font></td></tr>
	   <tr bgcolor="e3e9ff">
 	      <td width="50%" align="center" height="20"><font face="돋움" size="2">제 목</font></td>
 	      <td width="15%" align="center" height="20"><font face="돋움" size="2">글쓴이</font></td>
 	      <td width="15%" align="center" height="20"><font face="돋움" size="2">작성일</font></td>
 	      <td width="10%" align="center" height="20"><font face="돋움" size="2">조회수</font></td>
 	   </tr>

	   <tr th:if="${#lists.isEmpty(boardTopList)}">
	     <td colspan="4" align="center" height="20"><font face="돋움" size="2">등록된 글이 없습니다.</font></td>
	   </tr>

	   <tr th:each="board : ${boardTopList}" onMouseOver="style.backgroundColor='#D1EEEE'" onMouseOut="style.backgroundColor=''">
			<td align="left" height="20">&nbsp;
				<font face="돋움" size="2" color="#000000">
				<a class="list" th:href="@{/Board/board_view(idx=${board.idx})}" th:text="${board.subject}">제목부분입니다</a></td>
					<td align="center" height="20"><font face="돋움" size="2">
					<span th:text="${board.name}">관리자</span></font></td>
				<td align="center" height="20"><font face="돋움" size="2" th:text="${board.regdate}">2007-10-22</font></td>
				<td align="center" height="20"><font face="돋움" size="2"
				th:text="${board.readcnt}">3</font></td>
		</tr>
  		</table>
  	<hr>
	<table border="0" cellspacing="1" width="100%" align="center">
      <tr>
        <td colspan="7" align="center" valign="center" height="20">
        <font size="4" face="돋움" color="blue">
        <img src="/Images/img/bullet-01.gif"> <b>자료실</b></font></td></tr>
	   <tr bgcolor="e3e9ff">
 	      <td width="50%" align="center" height="20"><font face="돋움" size="2">제 목</font></td>
 	      <td width="15%" align="center" height="20"><font face="돋움" size="2">글쓴이</font></td>
 	      <td width="15%" align="center" height="20"><font face="돋움" size="2">작성일</font></td>
 	      <td width="10%" align="center" height="20"><font face="돋움" size="2">조회수</font></td>
 	   </tr>

	   <tr th:if="${#lists.isEmpty(pdsTopList)}">
	     <td colspan="4" align="center" height="20"><font face="돋움" size="2">등록된 자료가 없습니다.</font></td>
	   </tr>

	   <tr th:each="pds : ${pdsTopList}" onMouseOver="style.backgroundColor='#D1EEEE'" onMouseOut="style.backgroundColor=''">
			<td align="left" height="20">&nbsp;
				<font face="돋움" size="2" color="#000000">
				<a class="list" th:href="@{/Pds/pds_view(idx=${pds.idx})}" th:text="${pds.subject}">제목부분입니다</a></td>
					<td align="center" height="20"><font face="돋움" size="2">
					<span th:text="${pds.name}">관리자</span></font></td>
				<td align="center" height="20"><font face="돋움" size="2" th:text="${pds.regdate}">2007-10-22</font></td>
				<td align="center" height="20"><font face="돋움" size="2"
				th:text="${pds.readcnt}">3</font></td>
			</tr>
  		</table>


    </td>
  </tr>
  </table>
  </body>
  </html>
