<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>회원등록</title>
   <link rel="stylesheet" type="text/css" href="/stylesheet.css">
   <style type="text/css">
     td.title { padding:4px; background-color:#e3e9ff }
     td.content { padding:10px; line-height:1.6em; text-align:justify; }
     a.list { text-decoration:none;color:black;font-size:10pt; }
   </style>

<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script> 
<script type="text/javascript">
$(function(){

	$("#smscheck").hide();
	$("#emailcheck").hide();
	$("#emailshow").hide(); // 숨기기

	//라디오 버튼 선택시
	$("input[name='mode']").change(function() {
        if ($("#mode1").is(":checked")) {
            $("#phone").show();
            $("#emailshow").hide();
           	$("#smscheck").hide();
           	$("#emailcheck").hide();
        } else {
            $("#emailshow").show();
            $("#phone").hide();
           	$("#smscheck").hide();
           	$("#emailcheck").hide();
        }
    });
	
	// 등록 버튼 클릭시
	


	//핸드폰 인증하기/재발송 버튼 클릭시
	function sendSms(){
		var tel = $("#tel").val();
		if(!tel){
			alert("전화번호를 입력하세요");
			return;
		}
		$.post("/User/send_sms", {tel: tel}, function(res){
			alert(res.message);
			if(res.success) $("#smscheck").show();
		}, "json").fail(function(){
			alert("인증번호 발송에 실패했습니다. 잠시 후 다시 시도해주세요.");
		});
	}
	$("#phoneBtn1").click(sendSms);
	$("#phoneBtn2").click(sendSms);

	//핸드폰 인증번호 확인
	$("#phoneBtn3").click(function(){
		var code = $("#resms").val();
		$.post("/User/verify_sms", {code: code}, function(res){
			$("#resms_c").text(res.message);
			if(res.success) alert(res.message);
		}, "json").fail(function(){
			alert("인증 확인에 실패했습니다. 잠시 후 다시 시도해주세요.");
		});
	});

	//이메일 인증하기/재발송 버튼 클릭시
	function sendEmailCode(){
		var email = $("#email1").val() + "@" + $("#email2").val();
		if(!$("#email1").val() || !$("#email2").val()){
			alert("이메일을 입력하세요");
			return;
		}
		$.post("/User/send_email", {email: email}, function(res){
			alert(res.message);
			if(res.success) $("#emailcheck").show();
		}, "json").fail(function(){
			alert("인증번호 발송에 실패했습니다. 메일 서버 설정을 확인해주세요.");
		});
	}
	$("#emailBtn1").click(sendEmailCode);
	$("#emailBtn2").click(sendEmailCode);

	//이메일 인증번호 확인
	$("#emailBtn3").click(function(){
		var code = $("#reemail").val();
		$.post("/User/verify_email", {code: code}, function(res){
			$("#reemail_c").text(res.message);
			if(res.success) alert(res.message);
		}, "json").fail(function(){
			alert("인증 확인에 실패했습니다. 잠시 후 다시 시도해주세요.");
		});
	});

	//등록 버튼 클릭시 최소한의 클라이언트 검증
	$("form[name='user']").submit(function(){
		if(!$("#name").val() || !$("#userid").val() || !$("#passwd").val()){
			alert("필수 항목을 입력하세요");
			return false;
		}
		if($("#passwd").val() !== $("#repasswd").val()){
			alert("비밀번호가 일치하지 않습니다");
			return false;
		}
	});

	//이메일 체크(직접입력 또는 선택)
	$("#email3").on("change",function(){
		if($("#email3").prop("selectedIndex") !=0 ){
			$('#email2').prop('readonly', true);//읽기 전용으로
			$('#email2').val($("#email3").val());
		}else{
			$('#email2').prop('readonly', false);//읽기 전용 해제
			$('#email2').val('');
		}
	});


}); //$(function()끝


	
</script>
</head>

							<tr id="smscheck">

						<table cellpadding=0 cellspacing=0 border=0 width=100%>
