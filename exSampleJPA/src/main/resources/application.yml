#spring:application:name=exSampleSecurity
#db config(oracle)
spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521/xe
    username: c##sample
    password: 1234

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: true
    hibernate:
      ddl-auto: update # 엔티티 기준으로 테이블 자동 생성/수정
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

file:
 dir: C:/Users/컴퓨터/Documents/Zoom/ # 끝에 / 필수 (fileDir+fileName 으로 경로를 만듦)