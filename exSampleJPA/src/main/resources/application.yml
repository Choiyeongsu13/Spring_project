#spring:application:name=exSampleSecurity
#db config(oracle)
spring:
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521/xe
    username: c##sample
    password: 1234

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: true
    hibernate:
      ddl-auto: update # 엔티티 기준으로 테이블 자동 생성/수정
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
