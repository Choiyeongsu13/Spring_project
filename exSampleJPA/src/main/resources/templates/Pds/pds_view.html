<!-- 메뉴 include -->
	<th:block th:replace="~{Include/topmenu}"></th:block>

<html xmlns:th="http://www.thymeleaf.org">
   <head>
      <title> 자료 내용 보기 </title>
 <link rel="stylesheet" type="text/css" href="/stylesheet.css">
   <style type="text/css">
     td.title { padding:4px; background-color:#e3e9ff }
     td.content { padding:10px; line-height:1.6em; text-align:justify; }
     a.list { text-decoration:none;color:black;font-size:10pt; }
   </style>
 </head>

   <!--DB에서 검색한 자료를 화면에 출력  -->
 <body topmargin="0" leftmargin="0">
 <table border="0" width="800">
   <tr>
     <td width="20%"  height="500" bgcolor="#ecf1ef" valign="top">

		<!--  로그인 폼 추가 -->
 <th:block th:replace="~{Include/login_form}"></th:block>
     </td>
     <td width="80%" valign="top">
       &nbsp;<br>
     <table border="0" width="90%" align="center">
       <tr>
         <td colspan="2"><img src="/Images/img/bullet-01.gif">
           <font color="blue" size="3">참 좋은 자료실</font><font size="2"> - 자료읽기</font></td>
       </tr>
     </table>
     <p>

     <table border="0" width="90%" align="center" cellspacing="0" style="border-width:1px;border-color:#0066cc;border-style:outset;">
       <tr bgcolor="e3e9ff">
         <td class="title">
           <img src="/Images/img/bullet-04.gif">
           <font size="2" face="돋움" th:text="${pds.subject}"></font></td></tr>
		<tr>
			<td class="content">
				<p align="right"><font size="2" face="돋움"
					th:text="|${pds.name} / ${#temporals.format(pds.regdate,'yyyy-MM-dd')} / ${pds.readcnt}번 읽음|"></font>
				<p><font size="2" face="돋움" th:utext="${#strings.replace(#strings.escapeXml(pds.contents),newlineChar,'&lt;br&gt;')}"></font><p>
				<th:block th:if="${pds.filename != null}">
					<img src="/Images/img/disk.gif" align="middle" width="22" height="20" border="0">&nbsp;
					<th:block th:if="${pds.filesize >= 0}">
						<a class="list" th:href="@{/Pds/pds_download(idx=${pds.idx})}" th:text="${pds.filename}"></a>
						<font size="2" th:text="|(${pds.filesizeText})|"></font>
					</th:block>
					<!-- 예전 자료 : 서버에 파일이 없음 -->
					<font size="2" th:if="${pds.filesize < 0}" th:text="${pds.filename}"></font>
				</th:block>
			</td>
		</tr>
  </table>
  <p align="center">
  <font size="2">
  <a th:href="|javascript:pds_delete(${pds.idx}, ${page})|"><img src="/Images/img/del.gif" border="0"></a>&nbsp;&nbsp;&nbsp;&nbsp;
  <a th:href="@{/Pds/pds_list(page=${page})}"><img src="/Images/img/list-2.gif" border="0"></a></font>
     </td>
   </tr>
 </table>

</body>
</html>
