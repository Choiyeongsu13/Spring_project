<!-- 메뉴 include -->
	<th:block th:replace="~{Include/topmenu}"></th:block>

<html xmlns:th="http://www.thymeleaf.org">
   <head><title> 자료 수정 </title>
   <link rel="stylesheet" type="text/css" href="/stylesheet.css">
<script>
	function pds_send(){
		if(!pds.subject.value){
			alert("제목을 입력하세요");
			pds.subject.focus();
			return;
		}
		if(!pds.contents.value){
			alert("내용을 입력하세요");
			pds.contents.focus();
			return;
		}
		if(!pds.pass.value){
			alert("비밀번호를 입력하세요");
			pds.pass.focus();
			return;
		}
		pds.submit();
	}
</script>
   </head>
<body>

<table border="0" width="800">
 <tr>
   <td width="20%" height="500" bgcolor="#ecf1ef" valign="top">

	<!--     다음에 추가할 로그인  -->
 <th:block th:replace="~{Include/login_form}"></th:block>
   </td>
   <td width="80%" valign="top">&nbsp;<br>
     <img src="/Images/img/bullet-01.gif"><font size="3" face="돋움" color="blue"> <b>참 좋은 자료실</b></font>
     <font size="2"> - 자료수정</font><p>
     <img src="/Images/img/bullet-03.gif"><font size="2" face="돋움" color="orange"> 잠깐</font> &nbsp;
     <img src="/Images/img/bullet-02.gif"><font size="2" face="돋움">는 필수 입력 사항입니다.</font><p>

	<!-- 파일 업로드는 반드시 enctype="multipart/form-data" -->
	<form name="pds" method="post" th:action="@{/Pds/pds_modify}" enctype="multipart/form-data">
	<input type="hidden" name="idx" th:value="${pds.idx}">
	<input type="hidden" name="page" th:value="${page}">
	  <table border="0" >
		<tr>
         <td width="5%" align="right"><img src="/Images/img/bullet-02.gif"></td>
         <td width="15%"><font size="2" face="돋움">글쓴이</font></td>
         <td width="80%">
			<input type="text" size="20" name="name" th:value="${pds.name}" readonly></td>
		</tr>
       <tr>
         <td align="right"><img src="/Images/img/bullet-02.gif"></td>
         <td><font size="2" face="돋움">제목</font></td>
         <td><input type="text" size="60" name="subject" th:value="${pds.subject}"></td>
       </tr>
       <tr>
         <td align="right"><img src="/Images/img/bullet-02.gif"></td>
         <td><font size="2" face="돋움">내용</font></td>
         <td><textarea wrap="physical" rows="10" name="contents" cols="60" th:text="${pds.contents}"></textarea></td>
       </tr>
		<tr>
		  <td align="right">&nbsp;</td>
		  <td><font size="2" face="돋움">파일첨부</font></td>
		  <td>
		  	<font size="2" face="돋움" th:if="${pds.filename != null}">현재 파일 : <span th:text="${pds.filename}"></span><br></font>
		  	<input type="file" name="filename" size="30">
		  	<font size="2" face="돋움">*.파일을 바꿀 때만 선택하세요.</font>
		  </td></tr>
       <tr>
         <td align="right"><img src="/Images/img/bullet-02.gif"></td>
         <td><font size="2" face="돋움">비밀번호</font></td>
          <td><input type="password" size="10" name="pass" >
          <font size="2" face="돋움">*.글 작성시 입력한 비밀번호를 입력하세요.</font>
         </td>
        </tr>
		<tr>
          <td align="right">&nbsp;</td>
          <td><font size="2">&nbsp;</font></td>
          <td align=center>
			<img src="/Images/img/purple_save.gif" width="56" height="18" border="0" style="cursor:pointer" onClick="pds_send()">
			<img src="/Images/img/purple_cancle.gif" width="56" height="18" border="0" style="cursor:pointer" onClick="history.back()">
		  </td>
        </tr>
      </table>
	</form>
    </td>
  </tr>
 </table>
</body>
</html>
