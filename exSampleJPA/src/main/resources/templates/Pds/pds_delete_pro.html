<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>자료 삭제</title>
</head>
<body>
	<span th:if="${row == 1}">
		<script th:inline="javascript">
			alert("삭제되었습니다");
			opener.location.replace("/Pds/pds_list?page=" + [[${page}]]);
			self.close();
		</script>
	</span>
	<span th:if="${row == 0}">
		<script>
			alert("비밀번호가 일치하지 않습니다");
			history.back();
		</script>
	</span>
</body>
</html>
