#spring:application:name=exSampleSecurity
#db config(oracle)
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
       hibernate:
         format_sql: true
         use_sql_comments: true